name: research
description: 研究轨 — 采集 → 结论 → 建议（非工程类需求：育儿、股票、行业调研等）
version: 1
track: research
complexity: normal
# Sample track: it proves non-engineering requests fit the same plan/graph/HITL
# machinery instead of being forced through PRD → build → QA.
# The executors are mocks — swap them for an LLM executor in production.
roles:
  - id: product
    title: Research Lead
    persona: product
    executor: mock_product
  - id: design
    title: Analyst
    persona: design
    executor: mock_design
stages:
  - name: intake
    role: product
    label: 集结
    label_en: Intake
    output_contract:
      - intake.md
  - name: research_scan
    role: design
    label: 采集
    label_en: Scan
    hitl: false
    # 调研专用子代理：只在模板声明，代码里不硬编码业务角色（见 docs/plans/2026-11-24-全局子代理池.md）
    subagents:
      - id: web-researcher
        description: 检索公开资料并交叉验证，返回带来源的结论。需要多源比对或查最新信息时使用。
        capabilities: [web, read_files]
        max_turns: 12
  - name: research_synthesize
    role: product
    label: 结论
    label_en: Synthesize
    hitl_after: true
    on_reject: research_synthesize
  - name: research_recommend
    role: product
    label: 建议
    label_en: Recommend
    hitl_after: true
    on_reject: research_recommend
  - name: done
    role: product
    label: 完成
    label_en: Done
    hitl: false
