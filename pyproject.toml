[project]
name = "sortie-deck"
version = "0.1.0"
description = "Sortie Deck — AI-native office iteration control plane with pluggable stage executors"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Sortie Deck contributors" },
]
keywords = [
  "ai-agents",
  "langgraph",
  "orchestration",
  "hitl",
  "devops",
  "sortie-deck",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langchain-core>=0.3.0",
  # LLM 接入层走 LangChain ChatModel 抽象（见 llm_chain.py）
  "langchain-openai>=1.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1.0",
  # 远程 MCP 服务端（Streamable HTTP）。之前只是 claude-agent-sdk 的传递依赖，
  # 正式能力必须直接声明并锁定，否则上游一变就消失。
  "mcp>=2.3.0,<3",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0",
  "openpyxl>=3.1.0",
  # 全链路追踪：只装 API（纯接口，无传递依赖）。SDK/exporter 在 [otel] extra，
  # 未安装时 observability 模块自动退化为 no-op（见 sortie_deck/observability.py）。
  "opentelemetry-api>=1.29.0",
]

[project.urls]
Homepage = "https://github.com/lpliu-art/sortie-deck-todos"
Documentation = "https://github.com/lpliu-art/sortie-deck-todos/blob/dev/DESIGN.md"
Repository = "https://github.com/lpliu-art/sortie-deck-todos"
Issues = "https://github.com/lpliu-art/sortie-deck-todos/issues"
Changelog = "https://github.com/lpliu-art/sortie-deck-todos/blob/dev/CHANGELOG.md"

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=2.0.0", "psycopg[binary]>=3.2.0"]
s3 = ["boto3>=1.35.0"]
# 全链路追踪的运行时（SDK + OTLP/HTTP exporter）。不装则 observability 为 no-op。
otel = [
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-exporter-otlp-proto-http>=1.29.0",
]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]
# Agent harness providers (cloud runtime = the env this app runs in)
harness-claude = ["claude-agent-sdk>=0.1.0"]
docs = [
  "mkdocs-material>=9.5.0",
  "mkdocs-static-i18n>=1.2.0",
]

[project.scripts]
sortie = "sortie_deck.cli:main"
sortie-api = "sortie_deck.api.app:run"
# Legacy aliases
tdt = "sortie_deck.cli:main"
tdt-api = "sortie_deck.api.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sortie_deck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "B008",   # FastAPI Depends()/Header() in defaults
  "E501",   # line length handled by formatter preference
  "UP042",  # str Enum remains intentional for JSON/API
]

[tool.ruff.lint.per-file-ignores]
"src/sortie_deck/orchestrator.py" = ["BLE001", "S110", "SIM105"]
"src/sortie_deck/cli.py" = ["BLE001"]
